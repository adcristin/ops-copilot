services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./ops_copilot.db}
    networks:
      - ops-network

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8000
    networks:
      - ops-network
    depends_on:
      - backend

networks:
  ops-network:
    driver: bridge
