<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="640" fill="#14171C"/>

  <!-- subtle grid texture -->
  <g stroke="#2A2F38" stroke-width="1" opacity="0.5">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
  </g>

  <!-- left accent bar -->
  <rect x="0" y="0" width="6" height="640" fill="#D4A24C"/>

  <!-- eyebrow -->
  <text x="100" y="220" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8891A0" letter-spacing="3">OPS://</text>

  <!-- title -->
  <text x="100" y="300" font-family="'Inter', -apple-system, sans-serif" font-size="76" font-weight="700" fill="#F2F3F5" letter-spacing="-2">Copilot</text>

  <!-- tagline -->
  <text x="100" y="352" font-family="'Inter', -apple-system, sans-serif" font-size="22" fill="#8891A0">Automated delivery ops — call QA, mailbox triage, tasks, reporting</text>

  <!-- three status pills mimicking the app's dashboard cards -->
  <g font-family="'Inter', -apple-system, sans-serif">
    <rect x="100" y="410" width="230" height="90" rx="12" fill="#1B1F26" stroke="#2A2F38"/>
    <text x="122" y="445" font-size="12" fill="#8891A0" letter-spacing="1">CALLS SCORED</text>
    <text x="122" y="480" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="700" fill="#F2F3F5">89</text>

    <rect x="350" y="410" width="230" height="90" rx="12" fill="#1B1F26" stroke="#2A2F38"/>
    <text x="372" y="445" font-size="12" fill="#8891A0" letter-spacing="1">AVG QA SCORE</text>
    <text x="372" y="480" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="700" fill="#4C9A8D">79</text>

    <rect x="600" y="410" width="230" height="90" rx="12" fill="#1B1F26" stroke="#2A2F38"/>
    <text x="622" y="445" font-size="12" fill="#8891A0" letter-spacing="1">FLAGGED CALLS</text>
    <text x="622" y="480" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="700" fill="#D4A24C">8</text>
  </g>

  <!-- right side: mini bar chart echo -->
  <g>
    <rect x="980" y="330" width="50" height="170" rx="4" fill="#4C9A8D"/>
    <rect x="1045" y="380" width="50" height="120" rx="4" fill="#D4A24C"/>
    <rect x="1110" y="300" width="50" height="200" rx="4" fill="#4C9A8D"/>
    <rect x="1175" y="360" width="50" height="140" rx="4" fill="#D4A24C"/>
  </g>

  <!-- stack labels bottom -->
  <text x="100" y="565" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8891A0" letter-spacing="1">FASTAPI + JWT</text>
  <text x="270" y="565" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8891A0" letter-spacing="1">REACT + TYPESCRIPT</text>
  <text x="510" y="565" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8891A0" letter-spacing="1">ANTHROPIC / OPENROUTER</text>
  <text x="820" y="565" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8891A0" letter-spacing="1">DOCKER</text>
  <text x="930" y="565" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8891A0" letter-spacing="1">CI/CD</text>
</svg>
